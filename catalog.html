<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — WildBasket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="catalog-layout">
      <aside class="filters-panel">
        <h3>Категории</h3>
        <div id="category-filters"></div>

        <h3>Цена, ₽</h3>
        <div class="price-range">
          <input type="number" id="min-price" placeholder="от">
          <input type="number" id="max-price" placeholder="до">
        </div>

        <button class="btn btn-outline" id="clear-filters" style="width:100%">Сбросить фильтры</button>
      </aside>

      <section>
        <div class="catalog-toolbar">
          <div>
            <h1 id="catalog-title">Все товары</h1>
            <span id="results-count"></span>
          </div>
          <select class="sort-select" id="sort-select">
            <option value="popular">По популярности</option>
            <option value="price-asc">Сначала дешевле</option>
            <option value="price-desc">Сначала дороже</option>
            <option value="rating">По рейтингу</option>
            <option value="discount">По размеру скидки</option>
          </select>
        </div>

        <div class="product-grid" id="catalog-grid"></div>
        <div class="empty-state" id="no-results" style="display:none">
          <span class="empty-state-emoji">🔍</span>
          <h2>Ничего не найдено</h2>
          <p>Попробуйте изменить фильтры или поисковый запрос.</p>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product-card.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
