<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — WildBasket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <h1>Корзина</h1>

    <div class="cart-layout">
      <div>
        <div id="cart-list"></div>
        <div class="empty-state" id="cart-empty" style="display:none">
          <span class="empty-state-emoji">🛒</span>
          <h2>Корзина пуста</h2>
          <p>Загляните в каталог и выберите что-нибудь интересное.</p>
          <a class="btn btn-primary" href="catalog.html">В каталог</a>
        </div>
      </div>

      <aside class="cart-summary" id="cart-summary">
        <h3>Итого</h3>
        <div class="summary-row">
          <span>Товары, шт.</span>
          <span id="summary-items-count">0</span>
        </div>
        <div class="summary-row" id="summary-discount-row" style="display:none">
          <span>Скидка</span>
          <span class="success-text" id="summary-discount"></span>
        </div>
        <div class="summary-row total">
          <span>К оплате</span>
          <span id="summary-total">0 ₽</span>
        </div>
        <button class="btn btn-primary" id="checkout-btn">Оформить заказ</button>
        <div class="checkout-success" id="checkout-success">Заказ оформлен! Это демо-магазин, реальная оплата не выполнялась.</div>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <div class="pay-backdrop" id="pay-backdrop">
    <div class="pay-modal" id="pay-content"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart-page.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
