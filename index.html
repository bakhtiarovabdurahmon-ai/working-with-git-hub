<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WildBasket — мужская одежда</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Мужская одежда со скидками до 70%</h1>
        <p>Футболки, рубашки, брюки, верхняя одежда, обувь и аксессуары — всё для мужского гардероба с быстрой доставкой.</p>
        <a href="catalog.html" class="btn">Перейти в каталог</a>
      </div>
      <div class="hero-emoji">👔</div>
    </section>

    <section class="section">
      <div class="section-title"><span>Категории</span></div>
      <div class="cat-tiles" id="home-categories"></div>
    </section>

    <section class="section">
      <div class="section-title">
        <span>🔥 Товары дня</span>
        <a href="catalog.html">Смотреть всё</a>
      </div>
      <div class="product-grid" id="home-deals"></div>
    </section>

    <section class="section">
      <div class="section-title">
        <span>Популярное</span>
        <a href="catalog.html">Смотреть всё</a>
      </div>
      <div class="product-grid" id="home-popular"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product-card.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
